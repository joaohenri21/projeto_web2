<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Turma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-gray-900 text-white shadow">
        <div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold">
                CT <span class="text-red-500">JW</span>
            </div>

            <nav class="flex gap-6 text-sm font-medium">
                <a href="/" class="hover:text-red-400">Início</a>
                <a href="/alunos" class="hover:text-red-400">Alunos</a>
                <a href="/turmas" class="bg-red-500 px-4 py-2 rounded">Turmas</a>
                <a href="/professores" class="hover:text-red-400">Professores</a>
                <a href="/matriculas" class="hover:text-red-400">Matrículas</a>
                <a href="/presencas" class="hover:text-red-400">Presenças</a>
                <a href="/usuarios" class="hover:text-red-400">Usuários</a>
                <a href="/relatorios/turmas" class="hover:text-red-400">Relatórios</a>
            </nav>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">
                    Sair
                </button>
            </form>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-8 py-8">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Cadastro de Turma
            </h1>
            <p class="text-gray-500 mt-1">
                Preencha os dados abaixo para cadastrar ou editar uma turma.
            </p>
        </section>

        <section class="bg-white rounded shadow p-6">
            <form th:action="@{/turmas/salvar}" th:object="${turma}" method="post" class="space-y-5">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="block font-semibold mb-1">Nome da turma</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: Jiu-Jitsu Iniciante"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Modalidade</label>
                    <input type="text" th:field="*{modalidade}" placeholder="Ex: Jiu-Jitsu, Muay Thai, Boxe"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('modalidade')}" th:errors="*{modalidade}"
                        class="text-red-600 text-sm mt-1"></p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Dia da semana</label>
                    <select th:field="*{diaSemana}"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">
                        <option value="">Selecione</option>
                        <option value="Segunda-feira">Segunda-feira</option>
                        <option value="Terça-feira">Terça-feira</option>
                        <option value="Quarta-feira">Quarta-feira</option>
                        <option value="Quinta-feira">Quinta-feira</option>
                        <option value="Sexta-feira">Sexta-feira</option>
                        <option value="Sábado">Sábado</option>
                    </select>

                    <p th:if="${#fields.hasErrors('diaSemana')}" th:errors="*{diaSemana}"
                        class="text-red-600 text-sm mt-1"></p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Horário</label>
                    <input type="time" th:field="*{horario}"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}" class="text-red-600 text-sm mt-1">
                    </p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Professor responsável</label>

                    <input type="hidden" id="professorId" name="professorId"
                        th:value="${turma.professor != null ? turma.professor.id : ''}">

                    <input type="text" id="professorBusca" name="professorBusca"
                        th:value="${turma.professor != null ? turma.professor.nome : ''}"
                        placeholder="Digite o nome do professor" autocomplete="off"
                        hx-get="/turmas/pesquisar-professores" hx-trigger="keyup changed delay:300ms"
                        hx-target="#resultadoProfessores" hx-include="#professorBusca"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <ul id="resultadoProfessores" class="bg-white border border-gray-300 rounded mt-2 shadow">
                    </ul>

                    <p id="professorSelecionado" class="text-sm text-gray-500 mt-2"
                        th:text="${turma.professor != null ? 'Professor selecionado: ' + turma.professor.nome : 'Nenhum professor selecionado.'}">
                        Nenhum professor selecionado.
                    </p>

                    <p th:if="${erroProfessor != null}" th:text="${erroProfessor}" class="text-red-600 text-sm mt-1">
                    </p>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Salvar
                    </button>

                    <a href="/turmas" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </main>

    <script>
        function selecionarProfessor(id, nome) {
            document.getElementById("professorId").value = id;
            document.getElementById("professorBusca").value = nome;
            document.getElementById("resultadoProfessores").innerHTML = "";
            document.getElementById("professorSelecionado").innerText = "Professor selecionado: " + nome;
        }
    </script>

</body>

</html>
