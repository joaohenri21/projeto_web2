<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - CT JW</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded shadow w-full max-w-md">

    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">
            CT <span class="text-red-500">JW</span>
        </h1>

        <p class="text-gray-500 mt-2">
            Acesse o sistema
        </p>
    </div>

    <div th:if="${param.error}"
         class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
        Login ou senha inválidos.
    </div>

    <div th:if="${param.logout}"
         class="bg-green-100 text-green-700 p-3 rounded mb-4 text-sm">
        Você saiu do sistema.
    </div>

    <form th:action="@{/login}" method="post" class="space-y-5">

        <div>
            <label for="username" class="block font-semibold mb-1">
                Login
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400"
                   placeholder="Digite seu login">
        </div>

        <div>
            <label for="password" class="block font-semibold mb-1">
                Senha
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400"
                   placeholder="Digite sua senha">
        </div>

        <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

        <button type="submit"
                class="w-full bg-red-500 text-white py-3 rounded hover:bg-red-600 font-semibold">
            Entrar
        </button>

    </form>

</div>

</body>

</html>
