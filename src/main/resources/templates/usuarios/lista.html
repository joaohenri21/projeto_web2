<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Usuários', ~{::conteudo})}">

<body>

    <div th:fragment="conteudo">

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <section class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">
                    Usuários
                </h1>
                <p class="text-gray-500 mt-1">
                    Gerencie os usuários que podem acessar o sistema.
                </p>
            </div>

            <a href="/usuarios/novo" class="bg-red-500 text-white px-5 py-3 rounded shadow hover:bg-red-600">
                Novo Usuário
            </a>
        </section>

        <section th:if="${erro != null}" class="bg-red-100 text-red-700 p-4 rounded mb-6 font-semibold"
            th:text="${erro}">
            Mensagem de erro
        </section>

        <section class="bg-white rounded shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-900 text-white">
                    <tr>
                        <th class="p-3 text-left">Nome</th>
                        <th class="p-3 text-left">Login</th>
                        <th class="p-3 text-left">Papel</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:if="${paginaUsuarios.content.isEmpty()}">
                        <td colspan="4" class="p-4 text-center text-gray-500">
                            Nenhum usuário cadastrado.
                        </td>
                    </tr>

                    <tr th:each="usuario : ${paginaUsuarios.content}" class="border-t hover:bg-gray-50">

                        <td class="p-3 font-semibold" th:text="${usuario.nome}">
                            Nome
                        </td>

                        <td class="p-3" th:text="${usuario.login}">
                            Login
                        </td>

                        <td class="p-3">
                            <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm font-semibold"
                                th:text="${usuario.papel}">
                                Papel
                            </span>
                        </td>

                        <td class="p-3 text-center space-x-2">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                class="text-yellow-600 hover:underline">
                                Editar
                            </a>

                            <a th:if="${usuario.login != 'admin'}" th:href="@{/usuarios/excluir/{id}(id=${usuario.id})}"
                                onclick="return confirm('Deseja realmente excluir este usuário?')"
                                class="text-red-600 hover:underline">
                                Excluir
                            </a>

                            <span th:if="${usuario.login == 'admin'}" class="text-gray-400">
                                Admin padrão
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div class="flex justify-between items-center mt-6">
            <a th:if="${paginaUsuarios.hasPrevious()}" th:href="@{/usuarios(page=${paginaUsuarios.number - 1})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Anterior
            </a>

            <span class="text-gray-700">
                Página
                <span th:text="${paginaUsuarios.number + 1}">1</span>
                de
                <span th:text="${paginaUsuarios.totalPages}">1</span>
            </span>

            <a th:if="${paginaUsuarios.hasNext()}" th:href="@{/usuarios(page=${paginaUsuarios.number + 1})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Próxima
            </a>
        </div>

    </div>

</body>

</html>
