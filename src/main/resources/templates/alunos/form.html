<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-gray-900 text-white shadow">
        <div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold">
                CT <span class="text-red-500">JW</span>
            </div>

            <nav class="flex gap-6 text-sm font-medium">
                <a href="/" class="hover:text-red-400">Início</a>
                <a href="/alunos" class="bg-red-500 px-4 py-2 rounded">Alunos</a>
                <a href="/turmas" class="hover:text-red-400">Turmas</a>
                <a href="/professores" class="hover:text-red-400">Professores</a>
                <a href="/matriculas" class="hover:text-red-400">Matrículas</a>
                <a href="/presencas" class="hover:text-red-400">Presenças</a>
                <a href="/usuarios" class="hover:text-red-400">Usuários</a>
            </nav>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">
                    Sair
                </button>
            </form>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-8 py-8">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Cadastro de Aluno
            </h1>
            <p class="text-gray-500 mt-1">
                Preencha os dados abaixo para cadastrar ou editar um aluno.
            </p>
        </section>

        <section class="bg-white rounded shadow p-6">
            <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post" class="space-y-5">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="block font-semibold mb-1">Nome</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: João Henrique"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">CPF</label>
                    <input type="text" th:field="*{cpf}" placeholder="Ex: 000.000.000-00"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Salvar
                    </button>

                    <a href="/alunos" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </main>

</body>

</html>
