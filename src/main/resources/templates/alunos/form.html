<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-4xl mx-auto px-8 py-8">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Cadastro de Aluno
            </h1>
            <p class="text-gray-500 mt-1">
                Preencha os dados abaixo para cadastrar ou editar um aluno.
            </p>
        </section>

        <section class="bg-white rounded shadow p-6">
            <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post" class="space-y-5">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="block font-semibold mb-1">Nome</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: João Henrique"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div>
                    <label class="block font-semibold mb-1">CPF</label>
                    <input type="text" th:field="*{cpf}" placeholder="Ex: 000.000.000-00"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Salvar
                    </button>

                    <a href="/alunos" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
