<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Alunos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-7xl mx-auto px-8 py-8">

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <section class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">
                    Alunos
                </h1>
                <p class="text-gray-500 mt-1">
                    Gerencie os alunos cadastrados no centro de treinamento.
                </p>
            </div>

            <a href="/alunos/novo" class="bg-red-500 text-white px-5 py-3 rounded shadow hover:bg-red-600">
                Novo Aluno
            </a>
        </section>

        <section class="bg-white rounded shadow p-4 mb-6">
            <form th:action="@{/alunos}" method="get" class="flex gap-3">
                <input type="text" name="busca" th:value="${busca}" placeholder="Pesquisar aluno pelo nome"
                    class="flex-1 border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                <button type="submit" class="bg-gray-900 text-white px-6 py-3 rounded hover:bg-gray-800">
                    Pesquisar
                </button>

                <a href="/alunos" class="bg-red-500 text-white px-6 py-3 rounded hover:bg-red-600">
                    Limpar
                </a>
            </form>
        </section>

        <section class="bg-white rounded shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-900 text-white">
                    <tr>
                        <th class="p-3 text-left">Nome</th>
                        <th class="p-3 text-left">CPF</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:if="${paginaAlunos.content.isEmpty()}">
                        <td colspan="5" class="p-4 text-center text-gray-500">
                            Nenhum aluno cadastrado.
                        </td>
                    </tr>

                    <tr th:each="aluno : ${paginaAlunos.content}" class="border-t hover:bg-gray-50">
                        <td class="p-3 font-semibold" th:text="${aluno.nome}">Nome</td>
                        <td class="p-3" th:text="${aluno.cpf}">CPF</td>

                        <td class="p-3 text-center space-x-2">
                            <a th:href="@{/alunos/detalhes/{id}(id=${aluno.id})}" class="text-blue-600 hover:underline">
                                Detalhes
                            </a>

                            <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}" class="text-yellow-600 hover:underline">
                                Editar
                            </a>

                            <a th:href="@{/alunos/excluir/{id}(id=${aluno.id})}"
                                onclick="return confirm('Deseja realmente excluir este aluno?')"
                                class="text-red-600 hover:underline">
                                Excluir
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div class="flex justify-between items-center mt-6">
            <a th:if="${paginaAlunos.hasPrevious()}"
                th:href="@{/alunos(page=${paginaAlunos.number - 1}, busca=${busca})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Anterior
            </a>

            <span class="text-gray-700">
                Página
                <span th:text="${paginaAlunos.number + 1}">1</span>
                de
                <span th:text="${paginaAlunos.totalPages}">1</span>
            </span>

            <a th:if="${paginaAlunos.hasNext()}" th:href="@{/alunos(page=${paginaAlunos.number + 1}, busca=${busca})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Próxima
            </a>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
