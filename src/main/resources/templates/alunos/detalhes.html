<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-gray-900 text-white shadow">
        <div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold">
                CT <span class="text-red-500">JW</span>
            </div>

            <nav class="flex gap-6 text-sm font-medium">
                <a href="/" class="hover:text-red-400">Início</a>
                <a href="/alunos" class="bg-red-500 px-4 py-2 rounded">Alunos</a>
                <a href="/turmas" class="hover:text-red-400">Turmas</a>
                <a href="/professores" class="hover:text-red-400">Professores</a>
                <a href="/matriculas" class="hover:text-red-400">Matrículas</a>
                <a href="/presencas" class="hover:text-red-400">Presenças</a>
                <a href="/usuarios" class="hover:text-red-400">Usuários</a>
                <a href="/relatorios/turmas" class="hover:text-red-400">Relatórios</a>
            </nav>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">
                    Sair
                </button>
            </form>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-8 py-8">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Detalhes do Aluno
            </h1>
            <p class="text-gray-500 mt-1">
                Informações completas do aluno cadastrado.
            </p>
        </section>

        <section class="bg-white rounded shadow overflow-hidden">
            <div class="bg-gray-900 text-white px-6 py-4">
                <h2 class="text-xl font-bold" th:text="${aluno.nome}">
                    Nome do Aluno
                </h2>
                <p class="text-gray-300 text-sm">
                    Aluno cadastrado no centro de treinamento
                </p>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border rounded p-4">
                        <p class="text-sm text-gray-500 font-semibold uppercase">ID</p>
                        <p class="text-lg font-bold" th:text="${aluno.id}">1</p>
                    </div>

                    <div class="border rounded p-4">
                        <p class="text-sm text-gray-500 font-semibold uppercase">Nome</p>
                        <p class="text-lg font-bold" th:text="${aluno.nome}">Nome</p>
                    </div>

                    <div class="border rounded p-4">
                        <p class="text-sm text-gray-500 font-semibold uppercase">CPF</p>
                        <p class="text-lg font-bold" th:text="${aluno.cpf}">000.000.000-00</p>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}"
                        class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Editar
                    </a>

                    <a href="/alunos" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Voltar
                    </a>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
