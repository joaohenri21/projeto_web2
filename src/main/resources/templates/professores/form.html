<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Formulário de Professor', ~{::conteudo})}">

<body>

    <div th:fragment="conteudo">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Cadastro de Professor
            </h1>
            <p class="text-gray-500 mt-1">
                Preencha os dados abaixo para cadastrar ou editar um professor.
            </p>
        </section>

        <section class="bg-white rounded shadow p-6">
            <form th:action="@{/professores/salvar}" th:object="${professor}" method="post" class="space-y-5">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="block font-semibold mb-1">Nome</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: Carlos Silva"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Salvar
                    </button>

                    <a href="/professores" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </div>

</body>

</html>
