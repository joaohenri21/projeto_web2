<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Detalhes do Professor', ~{::conteudo})}">

<body>

    <div th:fragment="conteudo">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Detalhes do Professor
            </h1>
            <p class="text-gray-500 mt-1">
                Informações completas do professor cadastrado.
            </p>
        </section>

        <section class="bg-white rounded shadow overflow-hidden">
            <div class="bg-gray-900 text-white px-6 py-4">
                <h2 class="text-xl font-bold" th:text="${professor.nome}">
                    Nome do Professor
                </h2>
                <p class="text-gray-300 text-sm">
                    Professor cadastrado no centro de treinamento
                </p>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border rounded p-4">
                        <p class="text-sm text-gray-500 font-semibold uppercase">ID</p>
                        <p class="text-lg font-bold" th:text="${professor.id}">1</p>
                    </div>

                    <div class="border rounded p-4">
                        <p class="text-sm text-gray-500 font-semibold uppercase">Nome</p>
                        <p class="text-lg font-bold" th:text="${professor.nome}">Nome</p>
                    </div>

                </div>

                <div class="flex gap-3 pt-4">
                    <a th:href="@{/professores/editar/{id}(id=${professor.id})}"
                        class="bg-red-500 text-white px-6 py-3 rounded shadow hover:bg-red-600">
                        Editar
                    </a>

                    <a href="/professores" class="bg-gray-900 text-white px-6 py-3 rounded shadow hover:bg-gray-800">
                        Voltar
                    </a>
                </div>
            </div>
        </section>

    </div>

</body>

</html>
