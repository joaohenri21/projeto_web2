<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Matrículas', ~{::conteudo})}">

<body>

    <div th:fragment="conteudo">

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <section class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">
                    Matrículas
                </h1>
                <p class="text-gray-500 mt-1">
                    Gerencie os alunos matriculados nas turmas do centro de treinamento.
                </p>
            </div>

            <a href="/matriculas/nova" class="bg-red-500 text-white px-5 py-3 rounded shadow hover:bg-red-600">
                Nova Matrícula
            </a>
        </section>

        <section class="bg-white rounded shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-900 text-white">
                    <tr>
                        <th class="p-3 text-left">Aluno</th>
                        <th class="p-3 text-left">Turma</th>
                        <th class="p-3 text-left">Data da Matrícula</th>
                        <th class="p-3 text-left">Status</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:if="${paginaMatriculas.content.isEmpty()}">
                        <td colspan="5" class="p-4 text-center text-gray-500">
                            Nenhuma matrícula cadastrada.
                        </td>
                    </tr>

                    <tr th:each="matricula : ${paginaMatriculas.content}" class="border-t hover:bg-gray-50">

                        <td class="p-3 font-semibold"
                            th:text="${matricula.aluno != null ? matricula.aluno.nome : 'Sem aluno'}">
                            Nome do aluno
                        </td>

                        <td class="p-3" th:text="${matricula.turma != null ? matricula.turma.nome : 'Sem turma'}">
                            Nome da turma
                        </td>

                        <td class="p-3" th:text="${matricula.dataMatricula}">
                            Data
                        </td>

                        <td class="p-3">
                            <span th:if="${matricula.status == 'ATIVA'}"
                                class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm font-semibold">
                                ATIVA
                            </span>

                            <span th:if="${matricula.status == 'CANCELADA'}"
                                class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm font-semibold">
                                CANCELADA
                            </span>

                            <span th:if="${matricula.status != 'ATIVA' and matricula.status != 'CANCELADA'}"
                                class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm font-semibold"
                                th:text="${matricula.status}">
                                Status
                            </span>
                        </td>

                        <td class="p-3 text-center">
                            <a th:if="${matricula.status == 'ATIVA'}"
                                th:href="@{/matriculas/cancelar/{id}(id=${matricula.id})}"
                                onclick="return confirm('Deseja realmente cancelar esta matrícula?')"
                                class="text-red-600 hover:underline">
                                Cancelar
                            </a>

                            <span th:if="${matricula.status == 'CANCELADA'}" class="text-gray-400">
                                Sem ações
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div class="flex justify-between items-center mt-6">
            <a th:if="${paginaMatriculas.hasPrevious()}" th:href="@{/matriculas(page=${paginaMatriculas.number - 1})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Anterior
            </a>

            <span class="text-gray-700">
                Página
                <span th:text="${paginaMatriculas.number + 1}">1</span>
                de
                <span th:text="${paginaMatriculas.totalPages}">1</span>
            </span>

            <a th:if="${paginaMatriculas.hasNext()}" th:href="@{/matriculas(page=${paginaMatriculas.number + 1})}"
                class="bg-gray-900 text-white px-4 py-2 rounded hover:bg-gray-800">
                Próxima
            </a>
        </div>

    </div>

</body>

</html>
