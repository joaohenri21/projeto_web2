<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, conteudo)">

<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">CT JW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-7xl mx-auto px-8 py-8 flex-1 w-full">
        <th:block th:replace="${conteudo}"></th:block>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
