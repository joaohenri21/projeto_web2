<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nova Chamada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-gray-900 text-white shadow">
        <div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold">
                CT <span class="text-red-500">JW</span>
            </div>

            <nav class="flex gap-6 text-sm font-medium">
                <a href="/" class="hover:text-red-400">Início</a>
                <a href="/alunos" class="hover:text-red-400">Alunos</a>
                <a href="/turmas" class="hover:text-red-400">Turmas</a>
                <a href="/professores" class="hover:text-red-400">Professores</a>
                <a href="/matriculas" class="hover:text-red-400">Matrículas</a>
                <a href="/presencas" class="bg-red-500 px-4 py-2 rounded">Presenças</a>
                <a href="/usuarios" class="hover:text-red-400">Usuários</a>
            </nav>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">
                    Sair
                </button>
            </form>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-8 py-8">

        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Nova Chamada
            </h1>

            <p class="text-gray-500 mt-1">
                Escolha uma turma e marque os alunos presentes na aula.
            </p>
        </section>

        <section class="bg-white rounded shadow p-8 mb-6">

            <form th:action="@{/presencas/nova}" method="get" class="space-y-4">

                <div>
                    <label for="turmaId" class="block font-semibold mb-1">
                        Turma
                    </label>

                    <select id="turmaId" name="turmaId"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">

                        <option value="">
                            Selecione uma turma
                        </option>

                        <option th:each="turma : ${turmas}" th:value="${turma.id}"
                            th:selected="${turma.id == turmaSelecionadaId}"
                            th:text="${turma.nome + ' - ' + turma.modalidade}">
                            Nome da turma
                        </option>
                    </select>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="bg-gray-900 text-white px-5 py-3 rounded hover:bg-gray-800">
                        Buscar alunos
                    </button>
                </div>

            </form>

        </section>

        <section th:if="${erro != null}" class="bg-red-100 text-red-700 p-4 rounded mb-6 font-semibold"
            th:text="${erro}">
            Mensagem de erro
        </section>

        <section th:if="${matriculas != null}" class="bg-white rounded shadow p-8">

            <form th:action="@{/presencas/salvar}" method="post" class="space-y-6">

                <input type="hidden" name="turmaId" th:value="${turmaSelecionadaId}">

                <div>
                    <label for="dataHoraAula" class="block font-semibold mb-1">
                        Data e hora da aula
                    </label>

                    <input type="datetime-local" id="dataHoraAula" name="dataHoraAula"
                        class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-4">
                        Alunos matriculados
                    </h2>

                    <p th:if="${matriculas.isEmpty()}" class="text-gray-500">
                        Esta turma não possui alunos matriculados ativos.
                    </p>

                    <div th:if="${!matriculas.isEmpty()}" class="space-y-3">

                        <div th:each="matricula : ${matriculas}"
                            class="flex items-center justify-between border rounded p-4 hover:bg-gray-50">

                            <div>
                                <p class="font-semibold" th:text="${matricula.aluno.nome}">
                                    Nome do aluno
                                </p>

                                <p class="text-sm text-gray-500" th:text="${'Matrícula: ' + matricula.id}">
                                    Matrícula
                                </p>
                            </div>

                            <label class="flex items-center gap-2 font-semibold text-green-700">
                                <input type="checkbox" name="matriculasPresentes" th:value="${matricula.id}"
                                    class="w-5 h-5">

                                Presente
                            </label>

                        </div>

                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <a href="/presencas" class="bg-gray-500 text-white px-5 py-3 rounded hover:bg-gray-600">
                        Cancelar
                    </a>

                    <button type="submit" th:disabled="${matriculas.isEmpty()}"
                        class="bg-red-500 text-white px-5 py-3 rounded hover:bg-red-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
                        Salvar Chamada
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>

</html>
